plugins {
    id 'io.github.reyerizo.gradle.jcstress' version '1.0.0'
}

base {
    archivesName = 'feddi-usage-reporter'
}

jcstress {
    mode = 'quick'
}

dependencies {
    api project(':feddi-usage-proto')
    api 'com.graphql-java:graphql-java:0.0.0-2026-11-11T23-22-02-2f17eaf'
    api 'io.projectreactor:reactor-core:3.8.8'
    api 'org.jspecify:jspecify:1.0.1'

    testImplementation 'io.projectreactor:reactor-test:3.8.8'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}
